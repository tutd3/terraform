name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # dibutuhkan untuk assume role AWS via OIDC
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Apply (dev)
    runs-on: ubuntu-latest
    # Environment ini dipasangi "required reviewers" di pengaturan repo GitHub,
    # jadi job ini akan BERHENTI dan menunggu approval manual sebelum lanjut.
    # Satu approval ini menutupi apply ke-4 stack sekaligus (lihat step di bawah).
    environment: dev-apply

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Urutan wajib: vpc dulu (eks & ec2 baca output-nya lewat
      # terraform_remote_state), s3 independen jadi bebas kapan saja.
      #
      # Scope bisa dibatasi lewat repo variable APPLY_STACKS (mis. "vpc" saja,
      # atau "vpc s3"). Kosongkan/hapus variable itu untuk apply semua stack
      # seperti biasa (default).
      - name: Terraform Apply (vpc -> s3 -> ec2 -> eks)
        env:
          APPLY_STACKS: ${{ vars.APPLY_STACKS }}
        run: |
          set -e
          STACKS="${APPLY_STACKS:-vpc s3 ec2 eks}"
          echo "Stacks yang akan di-apply: $STACKS"
          for stack in $STACKS; do
            echo "::group::Apply stack: $stack"
            terraform -chdir="envs/dev/$stack" init -input=false
            terraform -chdir="envs/dev/$stack" apply -auto-approve -input=false
            echo "::endgroup::"
          done
