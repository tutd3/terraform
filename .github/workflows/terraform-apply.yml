name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # dibutuhkan untuk assume role AWS via OIDC
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Apply (dev)
    runs-on: ubuntu-latest
    # Environment ini dipasangi "required reviewers" di pengaturan repo GitHub,
    # jadi job ini akan BERHENTI dan menunggu approval manual sebelum lanjut
    # ke step apply.
    environment: dev-apply
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
