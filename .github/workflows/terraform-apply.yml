name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:
    inputs:
      stacks:
        description: >-
          Stack yang mau di-apply, pisah spasi/koma: vpc, s3, eks (atau k8s),
          ec2 (semua instance EC2), atau ec2/<nama> untuk satu instance EC2
          spesifik (mis. "ec2/psql"). Kosongkan untuk apply semua.
        required: false
        type: string
      environment:
        description: >-
          GitHub Environment yang dipakai (menentukan AWS_ROLE_ARN/AWS_REGION
          mana yang dipakai, lihat Settings > Environments di repo ini).
        required: false
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  id-token: write # dibutuhkan untuk assume role AWS via OIDC
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: "Apply (${{ github.event.inputs.environment || 'production' }})"
    runs-on: ubuntu-latest
    # Tiap GitHub Environment (production/staging) punya AWS_ROLE_ARN &
    # AWS_REGION sendiri-sendiri (Settings > Environments), dan dipasangi
    # "required reviewers" - job ini akan BERHENTI dan menunggu approval
    # manual sebelum lanjut. Default "production" kalau tidak dipilih
    # (push trigger biasa / merge PR).
    #
    # CATATAN: saat ini kode Terraform di envs/dev/ masih satu-satunya
    # environment yang benar-benar ada. Memilih "staging" di sini baru
    # mengganti kredensial AWS yang dipakai (begitu environment staging
    # diisi AWS_ROLE_ARN-nya) - belum ada stack Terraform terpisah untuk
    # staging. Itu langkah lanjutan terpisah (duplikasi envs/dev -> envs/staging).
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Scope stack mana yang di-apply, urutan prioritas:
      #   1. Input "stacks" saat Run workflow manual (workflow_dispatch) -
      #      paling fleksibel, langsung dari tab Actions tanpa ubah apa pun.
      #   2. Repo variable APPLY_STACKS - default sementara untuk auto-apply
      #      saat merge PR (push trigger), kalau mau dibatasi tanpa
      #      trigger manual.
      #   3. Semua stack (default kalau keduanya kosong).
      #
      # "ec2" itu kategori, bukan satu stack - bisa ada banyak instance EC2
      # dengan tujuan beda-beda di envs/dev/ec2/<nama>/ (mis. example, psql,
      # posthog). Tulis "ec2" untuk apply SEMUA instance EC2, atau
      # "ec2/<nama>" untuk apply satu instance spesifik saja.
      #
      # Urutan eksekusi SELALU vpc -> s3 -> ec2/* -> eks, apa pun urutan di
      # input, karena eks & ec2 baca output vpc lewat terraform_remote_state.
      - name: "Terraform Apply (urutan tetap: vpc -> s3 -> ec2/* -> eks)"
        env:
          DISPATCH_STACKS: ${{ github.event.inputs.stacks }}
          DEFAULT_STACKS: ${{ vars.APPLY_STACKS }}
        run: |
          set -e
          RAW="${DISPATCH_STACKS:-${DEFAULT_STACKS:-vpc s3 ec2 eks}}"
          # Normalisasi: lowercase, koma -> spasi, alias k8s -> eks
          RAW="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr ',' ' ' | sed 's/k8s/eks/g')"
          SELECTED=" $RAW "

          DIRS=()

          case "$SELECTED" in *" vpc "*) DIRS+=("envs/dev/vpc") ;; esac
          case "$SELECTED" in *" s3 "*) DIRS+=("envs/dev/s3") ;; esac

          # Setiap subfolder di envs/dev/ec2/ adalah instance EC2 sendiri,
          # dengan tujuan masing-masing (nama folder = nama tujuannya).
          for d in envs/dev/ec2/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            case "$SELECTED" in
              *" ec2 "*|*" ec2/$name "*) DIRS+=("envs/dev/ec2/$name") ;;
            esac
          done

          case "$SELECTED" in *" eks "*) DIRS+=("envs/dev/eks") ;; esac

          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "::error::Tidak ada stack valid di input '$RAW' (pilihan: vpc, s3, ec2 atau ec2/<nama>, eks/k8s)"
            exit 1
          fi

          echo "Stacks yang akan di-apply (urutan terjaga): ${DIRS[*]}"
          for dir in "${DIRS[@]}"; do
            echo "::group::Apply: $dir"
            terraform -chdir="$dir" init -input=false
            terraform -chdir="$dir" apply -auto-approve -input=false
            echo "::endgroup::"
          done
