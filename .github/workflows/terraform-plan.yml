name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # dibutuhkan untuk assume role AWS via OIDC
  contents: read
  pull-requests: write # dibutuhkan untuk komentar hasil plan di PR

env:
  TF_IN_AUTOMATION: "true"

# Urutan stack penting: eks/ec2 baca output vpc lewat terraform_remote_state,
# jadi kalau vpc belum pernah di-apply, plan eks/ec2 wajar gagal (state-nya
# belum ada). Ini normal untuk bring-up pertama kali - lihat komentar di PR.
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true # action ini kadang gagal karena GitHub API rate limit
        # saat fetch versi terbaru, bukan cuma karena temuan security - jangan
        # sampai itu ikut nge-block Terraform Plan di bawah.
        with:
          working_directory: .
          soft_fail: true # jangan gagalkan build dulu, sekadar laporan
          github_token: ${{ secrets.GITHUB_TOKEN }} # kurangi risiko kena rate limit

      - name: Terraform Plan per environment & stack (vpc, iam, s3/*, ec2/*, eks)
        id: plan
        run: |
          set +e
          : > plan-output.md
          overall=0

          # Tiap folder langsung di bawah envs/ adalah satu environment
          # (mis. production, staging). Di dalamnya: vpc & eks itu stack
          # tunggal, s3 & ec2 itu KATEGORI - tiap subfolder adalah instance
          # sendiri (nama folder = tujuan).
          #
          # Catatan: plan ini pakai SATU kredensial AWS (repo variable) untuk
          # semua environment - cukup untuk sekarang karena masih 1 akun AWS.
          # Kalau nanti staging punya akun AWS terpisah, plan utuh per-environment
          # perlu kredensial masing-masing juga (bukan cuma apply).
          DIRS=()
          for envdir in envs/*/; do
            [ -d "$envdir" ] || continue
            env="$(basename "$envdir")"
            DIRS+=("envs/$env/vpc")
            DIRS+=("envs/$env/iam")
            for category in s3 ec2; do
              for d in "envs/$env/$category"/*/; do
                [ -d "$d" ] || continue
                DIRS+=("envs/$env/$category/$(basename "$d")")
              done
            done
            DIRS+=("envs/$env/eks")
          done

          for dir in "${DIRS[@]}"; do
            label="${dir#envs/}"
            {
              echo "#### Stack: \`$label\`"
              echo '<details><summary>Show plan</summary>'
              echo
              echo '```terraform'
            } >> plan-output.md

            terraform -chdir="$dir" init -input=false -reconfigure >> plan-output.md 2>&1
            terraform -chdir="$dir" validate >> plan-output.md 2>&1
            terraform -chdir="$dir" plan -no-color -input=false >> plan-output.md 2>&1
            rc=$?

            {
              echo '```'
              echo '</details>'
              echo
            } >> plan-output.md

            if [ $rc -ne 0 ]; then
              echo "::warning::Plan gagal untuk stack '$label' (exit $rc). Kalau ini stack eks/ec2 dan vpc belum pernah di-apply, ini wajar."
              overall=1
            fi
          done
          echo "overall_failed=$overall" >> "$GITHUB_OUTPUT"

      - name: Comment plan result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('plan-output.md', 'utf8')
            const body = `### Terraform Plan (per stack)\n\n${plan.slice(0, 65000)}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            })
