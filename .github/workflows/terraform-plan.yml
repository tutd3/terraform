name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-*.yml"

# Kalau ada push baru ke PR yang sama sebelum run lama selesai, batalkan yang
# lama - tidak perlu plan ganda untuk commit yang sudah usang.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write # dibutuhkan untuk assume role AWS via OIDC
  contents: read
  pull-requests: write # dibutuhkan untuk komentar hasil plan di PR

env:
  TF_IN_AUTOMATION: "true"

# Urutan stack penting: eks/ec2 baca output vpc lewat terraform_remote_state,
# jadi kalau vpc belum pernah di-apply, plan eks/ec2 wajar gagal (state-nya
# belum ada). Ini normal untuk bring-up pertama kali - lihat komentar di PR.
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # perlu history lengkap untuk "git diff" (deteksi stack yang berubah di PR ini)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true # action ini kadang gagal karena GitHub API rate limit
        # saat fetch versi terbaru, bukan cuma karena temuan security - jangan
        # sampai itu ikut nge-block Terraform Plan di bawah.
        with:
          working_directory: .
          soft_fail: true # jangan gagalkan build dulu, sekadar laporan
          github_token: ${{ secrets.GITHUB_TOKEN }} # kurangi risiko kena rate limit

      # Output ditulis PER ENVIRONMENT (bukan 1 file gabungan semua environment)
      # supaya tidak kena limit 65.000 karakter komentar PR GitHub - setiap
      # environment dapat komentarnya sendiri. Detail lengkap SEMUA stack juga
      # ditulis ke step summary (lihat tab Actions > Summary run ini), yang
      # limitnya jauh lebih besar (~1MB) - jadi tidak ada yang hilang/terpotong
      # diam-diam lagi.
      #
      # Stack yang di-plan HANYA yang kena dampak perubahan di PR ini (lihat
      # .github/scripts/affected-stacks.sh) - bukan selalu semua stack di
      # semua environment. Kalau PR cuma ubah 1 stack, cuma 1 stack itu yang
      # di-plan, jadi lebih cepat dan komentarnya lebih relevan untuk di-review.
      - name: Terraform Plan per environment & stack (hanya yang kena dampak perubahan di PR ini)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          overall=0

          changed_file="$(mktemp)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          echo "File yang berubah di PR ini:"
          cat "$changed_file"

          for envdir in envs/*/; do
            [ -d "$envdir" ] || continue
            env="$(basename "$envdir")"

            DIRS=()
            while IFS= read -r stack; do
              [ -z "$stack" ] && continue
              DIRS+=("envs/$env/$stack")
            done < <(bash .github/scripts/affected-stacks.sh "$env" "$changed_file")

            out="plan-output-${env}.md"
            : > "$out"
            echo "### Terraform Plan - environment \`${env}\`" >> "$out"
            echo "" >> "$out"

            if [ ${#DIRS[@]} -eq 0 ]; then
              echo "_Tidak ada perubahan pada stack Terraform manapun di environment ini untuk PR ini._" >> "$out"
              echo "" >> "$out"
              cat "$out" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "| Stack | Status | Ringkasan |" >> "$out"
            echo "|---|---|---|" >> "$out"

            details_file="$(mktemp)"
            for dir in "${DIRS[@]}"; do
              label="${dir#envs/*/}"
              tmp="$(mktemp)"

              terraform -chdir="$dir" init -input=false -reconfigure > "$tmp" 2>&1
              terraform -chdir="$dir" validate >> "$tmp" 2>&1
              terraform -chdir="$dir" plan -no-color -input=false >> "$tmp" 2>&1
              rc=$?

              if [ $rc -eq 0 ]; then
                stack_status="✅ OK"
                summary_line="$(grep -E '^(Plan:|No changes\.)' "$tmp" | tail -1)"
              else
                stack_status="❌ Gagal (exit $rc)"
                summary_line="lihat detail di bawah"
                echo "::warning::Plan gagal untuk stack '$env/$label' (exit $rc). Kalau ini stack eks/ec2 dan vpc belum pernah di-apply, ini wajar."
                overall=1
              fi

              echo "| \`$label\` | $stack_status | $summary_line |" >> "$out"

              {
                echo ""
                echo "#### \`$label\`"
                echo "<details><summary>Show plan</summary>"
                echo ""
                echo '```terraform'
                cat "$tmp"
                echo '```'
                echo "</details>"
              } >> "$details_file"
              rm -f "$tmp"
            done

            echo "" >> "$out"
            cat "$details_file" >> "$out"
            rm -f "$details_file"

            # Salinan lengkap semua environment, tidak kena limit komentar PR.
            cat "$out" >> "$GITHUB_STEP_SUMMARY"
          done

          rm -f "$changed_file"
          echo "overall_failed=$overall" >> "$GITHUB_OUTPUT"

      # 1 komentar per environment, di-UPDATE di tempat kalau sudah ada
      # (ditandai komentar HTML tersembunyi) - supaya push berulang ke PR yang
      # sama tidak numpuk komentar baru terus-menerus.
      - name: Comment plan result on PR (1 per environment, update in place)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const files = fs.readdirSync('.').filter(f => /^plan-output-.*\.md$/.test(f))

            for (const file of files) {
              const env = file.replace(/^plan-output-/, '').replace(/\.md$/, '')
              const marker = `<!-- terraform-plan-bot: ${env} -->`
              let content = fs.readFileSync(file, 'utf8')

              // Batas aman per komentar PR (GitHub max ~65536 char/comment).
              const LIMIT = 60000
              if (content.length > LIMIT) {
                content = content.slice(0, LIMIT) + `\n\n> ⚠️ Dipotong karena kepanjangan - lihat detail lengkap di step summary run ini: ${context.payload.pull_request.html_url}/checks`
              }

              const body = `${marker}\n${content}`

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              })
              const existing = comments.data.find(c => c.body && c.body.includes(marker))

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                })
              }
            }
